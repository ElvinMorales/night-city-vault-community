name: Checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Owner explicitly requests production deployment after environment approval'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Resolve pinned Playwright Chromium executable
        shell: bash
        run: |
          chromium_path="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          test -x "$chromium_path"
          echo "COMMUNITY_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - run: npm run check
      # Reject unresolved code authority, unreviewed content, notices and unsuitable public history.
      # Never upload even a temporary Pages artifact before this passes.
      - run: npm run audit:release
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main' && vars.PAGES_APPROVAL_CONFIGURED == 'true'
        with:
          path: dist
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main' && vars.PAGES_APPROVAL_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
